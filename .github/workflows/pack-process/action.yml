name: 'Pack Process.'

runs:
  using: 'composite'
  steps:
      - name: Make Anykernel3 Flasher
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")
          FINAL_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip"
          
          # Move into the device_kernel directory where Anykernel3 lives
          cd $GITHUB_WORKSPACE/device_kernel/
          IMAGE_DIR="out/arch/${{ env.KERNEL_ARCH }}/boot"

          # Find the built kernel image
          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            IMAGE="$IMAGE_DIR/Image.gz-dtb"
            echo "Found Image.gz-dtb !"
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            IMAGE="$IMAGE_DIR/Image.gz"
            echo "Found Image.gz !"
          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            IMAGE="$IMAGE_DIR/Image"
            echo "Found Image !"
          else
            echo "[-] Error: No kernel image found in $IMAGE_DIR"
            exit 1
          fi

          # Ensure Anykernel3 directory exists before copying
          mkdir -p Anykernel3
          cp -fp "$IMAGE" Anykernel3/

          # Zipping and save directly inside device_kernel/
          cd Anykernel3 || exit 1
          zip -r9 "../$FINAL_ZIP" *
          cd ..

          # Export package name for upload step
          echo "PACK_NAME=$FINAL_ZIP" >> $GITHUB_ENV
          echo "[+] Successfully created: device_kernel/$FINAL_ZIP"

      - name: Make Latest Boot Image
        if: env.PACK_METHOD == 'MKBOOTIMG'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/

          IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/${{ env.KERNEL_ARCH }}/boot"
          TIME=$(date +"%Y%m%d%H%M%S")
          FORMAT_MKBOOTING=$(echo `mkboottools/unpack_bootimg.py --boot_img=boot_source_${{ env.DEVICE_NAME }}.img --format mkbootimg`)

          mkdir -p tmp

          mkboottools/unpack_bootimg.py --boot_img boot_source_${{ env.DEVICE_NAME }}.img

          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            rm -f out/kernel
            cp -fp $IMAGE_DIR/Image.gz-dtb out/kernel
            echo "Found Image.gz-dtb !"

          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            rm -f out/kernel
            cp -fp $IMAGE_DIR/Image.gz out/kernel
            echo "Found Image.gz !"

          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            rm -f out/kernel
            cp -fp $IMAGE_DIR/Image out/kernel
            echo "Found Image !"

          fi

          if [[ -f "$IMAGE_DIR/dtbo.img" ]]; then
            cp -fp $IMAGE_DIR/dtbo.img tmp
            echo "Found dtbo.img !"

          else
            echo
