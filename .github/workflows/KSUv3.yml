name: KSUv3

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "poco f1"
  DEVICE_CODENAME: "beryllium"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld"

  KERNEL_SOURCE: "https://github.com/JackA1ltman/kernel_xiaomi_sdm845_binder_cgroup_v2.git"
  KERNEL_BRANCH: "staging"

  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU: true
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/xiaomi/mi845_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # --- KERNELSU & SUSFS FULLY DISABLED ---
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "false"
  KERNELSU_AUTO_FORK: "" 

  SUSFS_ENABLE: false
  SUSFS_FIXED: false

  AK3_SOURCE: "https://github.com/Legendleo90/AnyKernel3.git"
  AK3_BRANCH: "electro"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "any rom"

  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: ""
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: ""

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/xiaomi/beryllium.config,vendor/debugfs.config"

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Xiaomi Mix2s (Evolution X 10 A15)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: Clear Stale Ccache
        run: |
          ccache -C || true
          ccache -z || true

      - name: Extra Kernel Options & Enable CONFIG_KSU
        run: |
          cd $GITHUB_WORKSPACE/device_kernel || true
          CONFIG_FILE="arch/arm64/configs/vendor/xiaomi/beryllium.config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$CONFIG_FILE"
            echo "[+] Successfully appended CONFIG_KSU=y and CONFIG_KSU_MANUAL_HOOK=y to $CONFIG_FILE"
          else
            echo "[-] Warning: beryllium.config not found at $CONFIG_FILE"
          fi

      - name: Apply SM6250 Manual Drivers & KernelSU-Next v3+
        run: |
          sudo apt-get update
          sudo apt-get install -y patchutils python3

          cd $GITHUB_WORKSPACE/device_kernel

          # 1. Download manual hook patch
          echo "[+] Downloading manual hook patch..."
          curl -sSL https://github.com/rifsxd/android_kernel_xiaomi_sm6250/commit/7f5f639fb8d98e893e9bfc14d922e865b42c1806.patch -o raw_commit.patch

          # 2. Filter drivers/ksu and fs/exec.c
          echo "[+] Filtering driver files and fs/exec.c..."
          filterdiff -x 'a/drivers/ksu/*' -x 'b/drivers/ksu/*' \
                     -x 'a/drivers/kernelsu/*' -x 'b/drivers/kernelsu/*' \
                     -x 'a/fs/exec.c' -x 'b/fs/exec.c' \
                     raw_commit.patch > core_hooks.patch || cp raw_commit.patch core_hooks.patch

          # 3. Apply core hooks
          echo "[+] Applying core kernel hooks..."
          git apply --3way --ignore-whitespace core_hooks.patch || {
            echo "[!] Standard 3-way patch failed. Attempting fuzzy apply..."
            git apply --reject --whitespace=fix core_hooks.patch || true
          }
          rm -f raw_commit.patch core_hooks.patch

          # 4. Inject header and execution hook into fs/exec.c (Fixes C90 ISO error via block scoping)
          python3 - << 'EOF'
          import os
          import re

          workspace = os.environ.get("GITHUB_WORKSPACE", ".")
          path = os.path.join(workspace, "device_kernel/fs/exec.c")

          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()

              # 1. Inject Header at top of file
              if "ksu_handle_execveat" not in content:
                  header = "\n#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#else\nstatic inline int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }\n#endif\n"
                  matches = list(re.finditer(r'^#include\s+["<].*?[">]', content, re.MULTILINE))
                  if matches:
                      pos = matches[-1].end()
                      content = content[:pos] + header + content[pos:]

              # 2. Inject Execution Hook wrapped inside a dedicated block scope
              if "ksu_handle_execveat(&fd" not in content:
                  # Wrapping in { ... } guarantees C90 compliance regardless of surrounding declarations
                  hook_code = "\n\t#ifdef CONFIG_KSU\n\t{\n\t\tksu_handle_execveat(&fd, &filename, (void *)&argv, (void *)&envp, &flags);\n\t}\n\t#endif\n"
                  
                  pos = content.find("do_execveat_common(")
                  if pos != -1:
                      # Find entry of do_execveat_common
                      brace_pos = content.find("{", pos)
                      if brace_pos != -1:
                          # Inject immediately at opening brace of function body
                          content = content[:brace_pos+1] + hook_code + content[brace_pos+1:]
                          print("[+] Injected block-scoped ksu_handle_execveat into do_execveat_common.")

              with open(path, "w") as f:
                  f.write(content)
          EOF

          # 5. Inject forward declarations into fs/namespace.c
          python3 - << 'EOF'
          import os
          import re

          workspace = os.environ.get("GITHUB_WORKSPACE", ".")
          path = os.path.join(workspace, "device_kernel/fs/namespace.c")

          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()

              if "struct mount;" not in content:
                  declarations = "\nstruct mount;\nstatic inline bool may_mount(void);\nstatic inline int check_mnt(struct mount *mnt);\nstatic int do_umount(struct mount *mnt, int flags);\nstatic void mntput_no_expire(struct mount *mnt);\n"
                  matches = list(re.finditer(r'^#include\s+["<].*?[">]', content, re.MULTILINE))
                  if matches:
                      pos = matches[-1].end()
                      content = content[:pos] + declarations + content[pos:]
                      with open(path, "w") as f:
                          f.write(content)
                      print("[+] Added namespace forward declarations.")
          EOF

          # 6. Fetch KernelSU-Next v3+
          echo "[+] Fetching KernelSU-Next v3+ source..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          # 7. Force CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_FILE="arch/arm64/configs/vendor/xiaomi/beryllium.config"
          if [ -f "$CONFIG_FILE" ]; then
            grep -q "CONFIG_KSU_MANUAL_HOOK=y" "$CONFIG_FILE" || echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$CONFIG_FILE"
            echo "[+] Verified CONFIG_KSU_MANUAL_HOOK=y in $CONFIG_FILE"
          fi

          # 8. Provide fallback stub for ksu_handle_devpts
          python3 - << 'EOF'
          import os
          import re

          workspace = os.environ.get("GITHUB_WORKSPACE", ".")
          path = os.path.join(workspace, "device_kernel/fs/devpts/inode.c")

          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()

              if "KSU_HANDLE_DEVPT_STUB" not in content:
                  stub = "\n#ifndef KSU_HANDLE_DEVPT_STUB\n#define KSU_HANDLE_DEVPT_STUB\nstruct inode;\nstatic inline int ksu_handle_devpts(struct inode *inode) { return 0; }\n#endif\n"
                  content = content.replace("extern int ksu_handle_devpts(struct inode*);", "/* extern int ksu_handle_devpts(struct inode*); */")
                  content = content.replace("extern int ksu_handle_devpts(struct inode *inode);", "/* extern int ksu_handle_devpts(struct inode *inode); */")

                  matches = list(re.finditer(r'^#include\s+["<].*?[">]', content, re.MULTILINE))
                  if matches:
                      pos = matches[-1].end()
                      content = content[:pos] + stub + content[pos:]
                      with open(path, "w") as f:
                          f.write(content)
                      print("[+] Injected compatible ksu_handle_devpts stub into fs/devpts/inode.c")
          EOF

          # 9. Patch SELinux hide
          python3 - << 'EOF'
          import os

          workspace = os.environ.get("GITHUB_WORKSPACE", ".")
          possible_paths = [
              os.path.join(workspace, "device_kernel/drivers/kernelsu/feature/selinux_hide.c"),
              os.path.join(workspace, "device_kernel/drivers/ksu/feature/selinux_hide.c"),
              os.path.join(workspace, "device_kernel/drivers/kernelsu/selinux/selinux.h"),
              os.path.join(workspace, "device_kernel/drivers/ksu/selinux/selinux.h")
          ]

          for file_path in possible_paths:
              if os.path.exists(file_path):
                  with open(file_path, "r") as f:
                      content = f.read()

                  updated = False
                  if 'security_context_to_sid("u:r:ksu:s0"' in content:
                      content = content.replace(
                          'security_context_to_sid("u:r:ksu:s0"',
                          'security_context_to_sid(&selinux_state, "u:r:ksu:s0"'
                      )
                      updated = True

                  if 'security_context_to_sid("u:r:priv_app:s0:c512,c768"' in content:
                      content = content.replace(
                          'security_context_to_sid("u:r:priv_app:s0:c512,c768"',
                          'security_context_to_sid(&selinux_state, "u:r:priv_app:s0:c512,c768"'
                      )
                      updated = True

                  if updated:
                      with open(file_path, "w") as f:
                          f.write(content)
                      print(f"[+] Successfully patched selinux signature in: {file_path}")
          EOF

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
