name: 'Patch NoMount'
description: 'Clones, patches, and integrates NoMount into the kernel VFS tree'
runs:
  using: 'composite'
  steps:
    - name: Setup and Patch NoMount for VFS Signatures
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: |
        cd device_kernel
        curl -s https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
        python3 - << 'EOF'
        import os, re
        f = 'fs/nomount/nomount.c'
        if os.path.exists(f):
            content = open(f).read()
            
            # 1. Fix vfs_getattr_nosec calls that have only 2 arguments
            content = content.replace('vfs_getattr_nosec(&info->r_path, stat)', 'vfs_getattr_nosec(&info->r_path, stat, 0, 0)')
            
            # 2. Inject local dentry and mnt variable declarations into modern nm_getattr safely
            modern_sig = 'static int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int query_flags)'
            if modern_sig in content:
                idx = content.find(modern_sig)
                brace_idx = content.find('{', idx)
                if brace_idx != -1:
                    body_start = brace_idx + 1
                    injection = '\n    struct dentry *dentry = path->dentry;\n    struct vfsmount *mnt = path->mnt;'
                    if 'struct dentry *dentry = path->dentry;' not in content[body_start:body_start+150]:
                        content = content[:body_start] + injection + content[body_start:]
                        print('[+] Injected dentry/mnt declarations into modern nm_getattr.')
            
            open(f, 'w').write(content)
            print('[+] Successfully applied clean NoMount VFS patch.')
        EOF
        DEFCONFIG_FILE="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
        if ! grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG_FILE"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FILE"
        fi
        
