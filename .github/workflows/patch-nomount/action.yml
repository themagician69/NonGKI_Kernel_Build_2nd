name: 'Patch NoMount'
description: 'Clones, patches, and integrates NoMount into the kernel VFS tree'
runs:
  using: 'composite'
  steps:
    - name: Setup and Patch NoMount for VFS Signatures
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: |
        cd device_kernel
        curl -s https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -
        python3 - << 'EOF'
        import os, re
        
        f = 'fs/nomount/nomount.c'
        if os.path.exists(f):
            content = open(f).read()
            
            # 1. Fix all vfs_getattr_nosec calls to pass 4 arguments
            content = re.sub(
                r'vfs_getattr_nosec\s*\(\s*([^,]+),\s*([^,\)]+)\s*\)',
                r'vfs_getattr_nosec(\1, \2, 0, 0)',
                content
            )
            
            # 2. Completely remove NoMount's conditional version block for nm_getattr signature and replace with modern signature
            modern_sig = 'static int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int query_flags)'
            content = re.sub(
                r'#if\s+LINUX_VERSION_CODE\s*<\s*KERNEL_VERSION\(4\s*,\s*11\s*,\s*0\).*?#endif',
                modern_sig,
                content,
                flags=re.DOTALL
            )
            
            # 3. Inject local dentry extraction right after the opening brace of nm_getattr
            pos = content.find('nm_getattr')
            if pos != -1:
                brace_pos = content.find('{', pos)
                if brace_pos != -1:
                    body_start = brace_pos + 1
                    local_var = '\n    struct dentry *dentry = path->dentry;'
                    if 'struct dentry *dentry = path->dentry;' not in content[body_start:body_start+80]:
                        content = content[:body_start] + local_var + content[body_start:]
                        print('[+] Successfully injected struct dentry *dentry = path->dentry;')
            
            open(f, 'w').write(content)
            print('[+] NoMount VFS conditional blocks cleaned and patched cleanly.')
        EOF
        
        DEFCONFIG_FILE="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
        if ! grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG_FILE"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FILE"
        fi
        
