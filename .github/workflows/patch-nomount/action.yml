name: 'Patch NoMount'
description: 'Clones and patches NoMount for the kernel'
runs:
  using: 'composite'
  steps:
    - name: Patch NoMount
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/device_kernel/
        
        # Clean up any previous attempts
        rm -rf fs/nomount nomount_temp
        
        # Clone the official repo into a temp folder
        git clone https://github.com/maxsteeel/nomount.git nomount_temp
        
        # Checkout the stable commit known to compile cleanly
        cd nomount_temp
        git checkout 7046c7a
        cd ..
        
        # Copy the kernel source files into fs/nomount
        mkdir -p fs/nomount
        cp -rf nomount_temp/kernel/* fs/nomount/
        
        # Clean up temp clone
        rm -rf nomount_temp

        # Ensure it's hooked into fs/Makefile
        if ! grep -q "nomount" fs/Makefile; then
          echo "obj-\$(CONFIG_NOMOUNT) += nomount/" >> fs/Makefile
        fi

        echo "CONFIG_NOMOUNT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

        echo "[+] Patched NoMount for your kernel successfully."
        
