name: 'Patch NoMount'
description: 'Manually integrates NoMount into the kernel VFS tree'
runs:
  using: 'composite'
  steps:
    - name: Patch NoMount
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/device_kernel
        
        # Clean up previous attempts
        rm -rf NoMount fs/nomount
        
        # 1. Clone NoMount and copy source files into fs/nomount/
        echo "Cloning NoMount framework..."
        git clone https://github.com/maxsteeel/nomount.git NoMount
        mkdir -p fs/nomount
        cp -rf NoMount/kernel/src/* fs/nomount/
        
        # Clean up the cloned repo folder
        rm -rf NoMount

        # 2. Register NoMount in filesystem build system
        echo "Integrating NoMount into fs/Makefile and fs/Kconfig..."
        grep -q "nomount" "fs/Makefile" || echo "obj-\$(CONFIG_NOMOUNT) += nomount/" >> "fs/Makefile"
        grep -q "fs/nomount/Kconfig" "fs/Kconfig" || echo 'source "fs/nomount/Kconfig"' >> "fs/Kconfig"

        # 3. Enable CONFIG_NOMOUNT in your target defconfig dynamically
        DEFCONFIG_FILE="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
        if ! grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG_FILE"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FILE"
            echo "[+] Added CONFIG_NOMOUNT=y to $DEFCONFIG_FILE"
        fi

        echo "[+] NoMount manual integration completed successfully."
        
