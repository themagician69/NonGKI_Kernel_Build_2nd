name: 'Patch NoMount'
description: 'Clones, patches, and adapts NoMount for the kernel VFS tree'
runs:
  using: 'composite'
  steps:
    - name: Patch NoMount
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/device_kernel
        
        # Clean up previous attempts
        rm -rf NoMount fs/nomount
        
        # 1. Clone NoMount and copy source files into fs/nomount/
        echo "Cloning NoMount framework..."
        git clone https://github.com/maxsteeel/nomount.git NoMount
        mkdir -p fs/nomount
        cp -rf NoMount/kernel/src/* fs/nomount/
        
        # Clean up the cloned repo folder
        rm -rf NoMount

        # 2. Adapt NoMount to match the kernel's 4-argument getattr API and fix dentry reference
        echo "[+] Adapting NoMount getattr signature and dentry references..."
        python3 - << 'EOF'
        import re

        path = 'fs/nomount/nomount.c'
        with open(path, 'r') as f:
            content = f.read()

        # Fix vfs_getattr_nosec call (add 0, 0 for request_mask and query_flags)
        content = content.replace(
            'vfs_getattr_nosec(&info->r_path, stat)',
            'vfs_getattr_nosec(&info->r_path, stat, 0, 0)'
        )

        # Fix nm_getattr function signature and map dentry to path->dentry
        old_sig_pattern = r'static int nm_getattr\s*\(\s*struct vfsmount\s*\*mnt\s*,\s*struct dentry\s*\*dentry\s*,\s*struct kstat\s*\*stat\s*\)\s*\{'
        new_replacement = 'static int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int query_flags) {\n    struct dentry *dentry = path->dentry;'
        
        content, count = re.subn(old_sig_pattern, new_replacement, content)
        print(f"[+] Successfully updated nm_getattr signature ({count} match).")

        with open(path, 'w') as f:
            f.write(content)
        EOF

        # 3. Register NoMount in filesystem build system
        echo "Integrating NoMount into fs/Makefile and fs/Kconfig..."
        grep -q "nomount" "fs/Makefile" || echo "obj-\$(CONFIG_NOMOUNT) += nomount/" >> "fs/Makefile"
        grep -q "fs/nomount/Kconfig" "fs/Kconfig" || echo 'source "fs/nomount/Kconfig"' >> "fs/Kconfig"

        # 4. Enable CONFIG_NOMOUNT in your target defconfig dynamically
        DEFCONFIG_FILE="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
        if ! grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG_FILE"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FILE"
            echo "[+] Added CONFIG_NOMOUNT=y to $DEFCONFIG_FILE"
        fi

        echo "[+] NoMount integration and patching completed successfully."
        
