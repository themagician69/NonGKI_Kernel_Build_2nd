name: 'Patch NoMount'
description: 'Clones and adapts NoMount for hybrid Linux 4.9 VFS signatures'
runs:
  using: 'composite'
  steps:
    - name: Patch NoMount
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/device_kernel
        
        # Clean up previous attempts
        rm -rf NoMount fs/nomount
        
        # 1. Clone NoMount and copy source files into fs/nomount/
        echo "Cloning NoMount framework..."
        git clone https://github.com/maxsteeel/nomount.git NoMount
        mkdir -p fs/nomount
        cp -rf NoMount/kernel/src/* fs/nomount/
        
        # Clean up cloned repo folder
        rm -rf NoMount

        # 2. Adapt NoMount to match the kernel's 4-argument getattr API and resolve dentry references
        echo "[+] Adapting NoMount for 4-argument VFS getattr..."
        python3 - << 'EOF'
        import re

        filename = 'fs/nomount/nomount.c'
        with open(filename, 'r') as f:
            content = f.read()

        # Fix vfs_getattr_nosec calls to pass 4 arguments
        content = re.sub(
            r'vfs_getattr_nosec\s*\(\s*([^,]+),\s*([^)]+)\s*\)',
            r'vfs_getattr_nosec(\1, \2, 0, 0)',
            content
        )

        # Fix nm_getattr function signature for 4 arguments
        pattern = r'(static\s+)?int\s+nm_getattr\s*\([^)]*\)'
        replacement = 'static int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int query_flags)'
        content, _ = re.subn(pattern, replacement, content)

        # Inject local dentry mapping where d_backing_inode(dentry) is used
        idx = content.find('d_backing_inode(dentry)')
        while idx != -1:
            brace_idx = content.rfind('{', 0, idx)
            if brace_idx != -1:
                func_body_snippet = content[brace_idx:idx]
                if 'struct dentry *dentry' not in func_body_snippet:
                    content = content[:brace_idx + 1] + '\n    struct dentry *dentry = path->dentry;' + content[brace_idx + 1:]
                    idx = content.find('d_backing_inode(dentry)', brace_idx + len('\n    struct dentry *dentry = path->dentry;'))
                else:
                    break
            else:
                break
            idx = content.find('d_backing_inode(dentry)', idx + 1)

        with open(filename, 'w') as f:
            f.write(content)
        print("[+] NoMount VFS adaptation applied successfully.")
        EOF

        # 3. Register NoMount in filesystem build system
        echo "Integrating NoMount into fs/Makefile and fs/Kconfig..."
        grep -q "nomount" "fs/Makefile" || echo "obj-\$(CONFIG_NOMOUNT) += nomount/" >> "fs/Makefile"
        grep -q "fs/nomount/Kconfig" "fs/Kconfig" || echo 'source "fs/nomount/Kconfig"' >> "fs/Kconfig"

        # 4. Enable CONFIG_NOMOUNT in your target defconfig dynamically
        DEFCONFIG_FILE="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
        if ! grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG_FILE"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FILE"
            echo "[+] Added CONFIG_NOMOUNT=y to $DEFCONFIG_FILE"
        fi

        echo "[+] NoMount integration completed successfully."
        
