name: 'Patch NoMount'
description: 'Clones, patches, and integrates NoMount into the kernel VFS tree'
runs:
  using: 'composite'
  steps:
    - name: Patch NoMount
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: cd $GITHUB_WORKSPACE/device_kernel && rm -rf NoMount fs/nomount && git clone https://github.com/maxsteeel/nomount.git NoMount && mkdir -p fs/nomount && cp -rf NoMount/kernel/src/* fs/nomount/ 2>/dev/null || true && cp -f NoMount/kernel/Kconfig fs/nomount/ 2>/dev/null || true && cp -f NoMount/kernel/Makefile fs/nomount/ 2>/dev/null || true && [ -f fs/nomount/Kconfig ] || printf "config NOMOUNT\n    bool \"NoMount\"\n    default y\n" > fs/nomount/Kconfig && [ -f fs/nomount/Makefile ] || echo "obj-\$(CONFIG_NOMOUNT) += nomount.o" > fs/nomount/Makefile && rm -rf NoMount && python3 -c "import os; f='fs/nomount/nomount.c'; 
      if os.path.exists(f):
          with open(f, 'r') as file: c = file.read()
          c = c.replace('vfs_getattr_nosec(&info->r_path, stat)', 'vfs_getattr_nosec(&info->r_path, stat, 0, 0)')
          p = c.find('nm_getattr')
          if p != -1:
              sp = c.rfind('int', 0, p)
              bp = c.find('{', p)
              if sp != -1 and bp != -1:
                  c = c.replace(c[sp:bp + 1], 'static int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int query_flags) {\n    struct dentry *dentry = path->dentry;\n    struct vfsmount *mnt = path->mnt;', 1)
          with open(f, 'w') as file: file.write(c)" && grep -q "nomount" fs/Makefile || echo "obj-\$(CONFIG_NOMOUNT) += nomount/" >> fs/Makefile && grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig || echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig && DEFCONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}" && grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG" || echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG" && echo "[+] NoMount integration completed successfully."
		  
