name: 'Patch NoMount'
description: 'Clones, patches, and adapts NoMount for Linux 4.9 VFS compatibility'
runs:
  using: 'composite'
  steps:
    - name: Patch NoMount
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/device_kernel
        
        # Clean up previous attempts
        rm -rf NoMount fs/nomount
        
        # 1. Clone NoMount and copy source files into fs/nomount/
        echo "Cloning NoMount framework..."
        git clone https://github.com/maxsteeel/nomount.git NoMount
        mkdir -p fs/nomount
        cp -rf NoMount/kernel/src/* fs/nomount/
        
        # Clean up the cloned repo folder
        rm -rf NoMount

        # 2. Precision Python patcher for nm_getattr and vfs_getattr_nosec
        echo "[+] Applying precision VFS compatibility patches to NoMount..."
        python3 - << 'EOF'
        import re

        filename = 'fs/nomount/nomount.c'
        with open(filename, 'r') as f:
            content = f.read()

        # Fix vfs_getattr_nosec calls to pass 4 arguments
        content = re.sub(
            r'vfs_getattr_nosec\s*\(\s*([^,]+),\s*([^)]+)\s*\)',
            r'vfs_getattr_nosec(\1, \2, 0, 0)',
            content
        )

        # Target ONLY nm_getattr signature and inject local dentry/mnt mappings safely inside its scope
        nm_getattr_pattern = r'static\s+int\s+nm_getattr\s*\([^)]*\)\s*\{'
        
        def replace_getattr(match):
            return 'static int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int query_flags) {\n    struct dentry *dentry = path->dentry;\n    struct vfsmount *mnt = path->mnt;'

        content, count = re.subn(nm_getattr_pattern, replace_getattr, content)
        print(f"[+] Successfully patched nm_getattr signature and scope ({count} match).")

        with open(filename, 'w') as f:
            f.write(content)
        print("[+] Precision patching completed successfully.")
        EOF

        # 3. Register NoMount in filesystem build system
        echo "Integrating NoMount into fs/Makefile and fs/Kconfig..."
        grep -q "nomount" "fs/Makefile" || echo "obj-\$(CONFIG_NOMOUNT) += nomount/" >> "fs/Makefile"
        grep -q "fs/nomount/Kconfig" "fs/Kconfig" || echo 'source "fs/nomount/Kconfig"' >> "fs/Kconfig"

        # 4. Enable CONFIG_NOMOUNT in your target defconfig dynamically
        DEFCONFIG_FILE="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
        if ! grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG_FILE"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FILE"
            echo "[+] Added CONFIG_NOMOUNT=y to $DEFCONFIG_FILE"
        fi

        echo "[+] NoMount integration and patching completed successfully."
        
