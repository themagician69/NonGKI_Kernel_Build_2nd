name: 'Patch NoMount'
description: 'Clones, patches, and integrates NoMount into the kernel VFS tree'
runs:
  using: 'composite'
  steps:
    - name: Setup and Patch NoMount for VFS Signatures
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: |
        cd device_kernel
        curl -s https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
        python3 - << 'EOF'
        import os, re
        
        f = 'fs/nomount/nomount.c'
        if os.path.exists(f):
            content = open(f).read()
            
            # 1. Fix all vfs_getattr_nosec calls to pass 4 arguments
            content = re.sub(
                r'vfs_getattr_nosec\s*\(\s*([^,]+),\s*([^,\)]+)\s*\)',
                r'vfs_getattr_nosec(\1, \2, 0, 0)',
                content
            )
            
            # 2. Force modern 4-argument signature for nm_getattr and inject local pointer definitions safely
            pos = content.find('nm_getattr')
            if pos != -1:
                func_start = content.rfind('static int', 0, pos)
                brace_pos = content.find('{', pos)
                if func_start != -1 and brace_pos != -1:
                    modern_sig = 'static int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int query_flags)'
                    body_start = brace_pos + 1
                    local_vars = '\n    struct dentry *dentry = path->dentry;\n    struct vfsmount *mnt = path->mnt;'
                    
                    content = content[:func_start] + modern_sig + ' {' + local_vars + content[body_start:]
                    print('[+] Successfully patched nm_getattr signature and injected local dentry/mnt definitions.')
            
            open(f, 'w').write(content)
            print('[+] NoMount VFS patch applied cleanly.')
        EOF
        
        DEFCONFIG_FILE="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
        if ! grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG_FILE"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FILE"
        fi
        
