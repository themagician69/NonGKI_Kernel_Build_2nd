name: 'Patch NoMount'
description: 'Clones, patches, and adapts NoMount for the kernel VFS tree'
runs:
  using: 'composite'
  steps:
    - name: Patch NoMount
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/device_kernel
        
        # Clean up previous attempts
        rm -rf NoMount fs/nomount
        
        # 1. Clone NoMount and copy source files into fs/nomount/
        echo "Cloning NoMount framework..."
        git clone https://github.com/maxsteeel/nomount.git NoMount
        mkdir -p fs/nomount
        cp -rf NoMount/kernel/src/* fs/nomount/
        
        # Clean up the cloned repo folder
        rm -rf NoMount

        # 2. Robustly adapt NoMount getattr signature and arguments via Python
        echo "[+] Adapting NoMount getattr signature and compatibility..."
        python3 - << 'EOF'
        import re

        path = 'fs/nomount/nomount.c'
        with open(path, 'r') as f:
            content = f.read()

        # Fix vfs_getattr_nosec call (add 0, 0 for request_mask and query_flags)
        content = content.replace(
            'vfs_getattr_nosec(&info->r_path, stat)',
            'vfs_getattr_nosec(&info->r_path, stat, 0, 0)'
        )

        # Flexible pattern to match nm_getattr definition regardless of parameter naming/spacing
        pattern = r'(static\s+)?int\s+nm_getattr\s*\([^)]*\)'
        replacement = 'static int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int query_flags)'
        
        new_content, count = re.subn(pattern, replacement, content)
        print(f"[+] Replaced nm_getattr signature matches: {count}")

        # Inject local dentry and mnt definitions right at the beginning of nm_getattr
        target = 'static int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int query_flags) {'
        injection = target + '\n    struct dentry *dentry = path->dentry;\n    struct vfsmount *mnt = path->mnt;'
        
        if target in new_content:
            content = new_content.replace(target, injection, 1)
            print("[+] Successfully injected local dentry/mnt mappings.")
        else:
            content = new_content
            print("[-] Warning: Target signature header for body injection not found exactly.")

        with open(path, 'w') as f:
            f.write(content)
        EOF

        # 3. Register NoMount in filesystem build system
        echo "Integrating NoMount into fs/Makefile and fs/Kconfig..."
        grep -q "nomount" "fs/Makefile" || echo "obj-\$(CONFIG_NOMOUNT) += nomount/" >> "fs/Makefile"
        grep -q "fs/nomount/Kconfig" "fs/Kconfig" || echo 'source "fs/nomount/Kconfig"' >> "fs/Kconfig"

        # 4. Enable CONFIG_NOMOUNT in your target defconfig dynamically
        DEFCONFIG_FILE="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
        if ! grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG_FILE"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FILE"
            echo "[+] Added CONFIG_NOMOUNT=y to $DEFCONFIG_FILE"
        fi

        echo "[+] NoMount integration and patching completed successfully."
        
