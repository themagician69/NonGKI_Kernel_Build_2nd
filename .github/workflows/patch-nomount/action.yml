name: 'Patch NoMount'
description: 'Clones, patches, and integrates NoMount into the kernel VFS tree'
runs:
  using: 'composite'
  steps:
    - name: Setup and Patch NoMount for VFS Signatures
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: |
        cd device_kernel
        curl -s https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
        python3 - << 'EOF'
        import os, re
        
        f = 'fs/nomount/nomount.c'
        if os.path.exists(f):
            content = open(f).read()
            
            # 1. Ensure all vfs_getattr_nosec calls pass 4 arguments
            content = re.sub(
                r'vfs_getattr_nosec\s*\(\s*([^,\)]+),\s*([^,\)]+)\s*\)',
                r'vfs_getattr_nosec(\1, \2, 0, 0)',
                content
            )
            
            # 2. Lower NoMount's VFS getattr version threshold from 4.11.0 to 4.8.0 
            # This forces the kernel tree to use NoMount's native modern 4-arg block safely.
            content = content.replace('KERNEL_VERSION(4, 11, 0)', 'KERNEL_VERSION(4, 8, 0)')
            
            open(f, 'w').write(content)
            print('[+] Successfully adjusted NoMount version threshold for backported 4.9 VFS.')
        EOF
        
        DEFCONFIG_FILE="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
        if ! grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG_FILE"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FILE"
        fi
        
