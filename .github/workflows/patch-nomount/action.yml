name: 'Patch NoMount'
description: 'Clones, patches, and integrates NoMount into the kernel VFS tree'
runs:
  using: 'composite'
  steps:
    - name: Setup and Patch NoMount for VFS Signatures
      if: env.NOMOUNT_ENABLE == 'true'
      shell: bash
      run: |
        cd device_kernel
        curl -s https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
        python3 -c "
        import os, re
        f = 'fs/nomount/nomount.c'
        if os.path.exists(f):
            content = open(f).read()
            
            # 1. Fix all vfs_getattr_nosec calls to use 4 arguments
            content = re.sub(r'vfs_getattr_nosec\s*\(([^,\)]+),\s*([^,\)]+)\)', r'vfs_getattr_nosec(\1, \2, 0, 0)', content)
            
            # 2. Remove the old #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 11, 0) wrapper around nm_getattr
            content = re.sub(r'#if\s+LINUX_VERSION_CODE\s*<\s*KERNEL_VERSION\(4\s*,\s*11\s*,\s*0\).*?#else\s*', '', content, flags=re.DOTALL)
            content = re.sub(r'#endif\s*/\*.*?nm_getattr.*?\*/', '', content)
            
            # 3. Force the modern 4-argument signature for nm_getattr and inject local dentry/mnt definitions
            old_sig_pattern = r'static int nm_getattr\s*\([^\)]+\)\s*\{'
            replacement = '''static int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int query_flags) {
    struct dentry *dentry = path->dentry;
    struct vfsmount *mnt = path->mnt;'''
            
            if re.search(old_sig_pattern, content):
                content = re.sub(old_sig_pattern, replacement, content, count=1)
            
            open(f, 'w').write(content)
            print('[+] Successfully forced modern 4-arg nm_getattr implementation.')
        "
        DEFCONFIG_FILE="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
        if ! grep -q "CONFIG_NOMOUNT=y" "$DEFCONFIG_FILE"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FILE"
        fi
        
