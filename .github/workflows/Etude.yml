name: Etude

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "poco f1"
  DEVICE_CODENAME : "beryllium"

  # Updated to pass full LLVM toolchain cross-compile prefixes
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
  
  # Set LLVM=1, LLVM_IAS=1, and all LLVM binutils (LD, AR, NM, etc.) matching Prelude-Clang
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip KSU_VERSION=33204"

  KERNEL_SOURCE : "https://github.com/themagician69/kernel_xiaomi_beryllium.git"
  KERNEL_BRANCH : "15.0"

  # Prelude-Clang from original build script
  CLANG_SOURCE : "https://gitlab.com/jjpprrrr/prelude-clang.git"
  CLANG_BRANCH : "master"

  # Set GCC_GNU to true so build system avoids ancient 4.9 GCC ld linkers
  GCC_GNU : true
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/sdm845-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "next"

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/Legendleo90/AnyKernel3.git"
  AK3_BRANCH : "electro"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "EtudeKSUN33204"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mix2s_evox_a15"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "beryllium_defconfig"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Beryllium build kernel
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options & Fix SELinux Signature Functions
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Ensure vDSO uses $(LD) / ld.lld instead of falling back to host gcc-64 linker
          if [ -f "arch/arm64/kernel/vdso/Makefile" ]; then
            sed -i 's/\$(CROSS_COMPILE)ld/\$(LD)/g' arch/arm64/kernel/vdso/Makefile
            echo "[+] Updated arch/arm64/kernel/vdso/Makefile to use LLVM ld.lld"
          fi

          # Overwrite calculated git version code with 33204 in Kbuild
          for kbuild in drivers/kernelsu/Kbuild drivers/ksu/Kbuild; do
            if [ -f "$kbuild" ]; then
              sed -i 's/KSU_VERSION ?=.*/KSU_VERSION := 33204/' "$kbuild"
              sed -i 's/KSU_VERSION :=.*/KSU_VERSION := 33204/' "$kbuild"
              echo "[+] Applied version 33204 override to $kbuild"
            fi
          done

          # 1. Ensure Kconfig and Makefile entries are present with correct relative paths
          if [ -d "drivers/kernelsu" ] || [ -d "drivers/ksu" ]; then
            KSU_DIR=""
            KSU_SUBDIR=""
            if [ -d "drivers/kernelsu" ]; then
              KSU_DIR="drivers/kernelsu"
              KSU_SUBDIR="kernelsu"
            elif [ -d "drivers/ksu" ]; then
              KSU_DIR="drivers/ksu"
              KSU_SUBDIR="ksu"
            fi

            if ! grep -q "$KSU_SUBDIR/Kconfig" drivers/Kconfig; then
              echo "source \"$KSU_DIR/Kconfig\"" >> drivers/Kconfig
              echo "[+] Added $KSU_DIR/Kconfig to drivers/Kconfig"
            fi

            if ! grep -q "$KSU_SUBDIR/" drivers/Makefile; then
              echo "obj-y += $KSU_SUBDIR/" >> drivers/Makefile
              echo "[+] Added obj-y += $KSU_SUBDIR/ to drivers/Makefile"
            fi
          fi

          # 2. Guarantee KernelSU and SELinux state configs across defconfigs
          echo "CONFIG_KSU=y" >> arch/arm64/configs/beryllium_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/sdm845-perf_defconfig
          echo "CONFIG_KSU_COMPAT_USE_SELINUX_STATE=y" >> arch/arm64/configs/beryllium_defconfig
          echo "CONFIG_KSU_COMPAT_USE_SELINUX_STATE=y" >> arch/arm64/configs/vendor/sdm845-perf_defconfig

          # 3. Safely append -DKSU_COMPAT_USE_SELINUX_STATE to existing KSU Makefiles/Kbuilds
          for dir in drivers/kernelsu drivers/ksu; do
            if [ -d "$dir" ]; then
              find "$dir" -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sh -c 'echo "ccflags-y += -DKSU_COMPAT_USE_SELINUX_STATE" >> "$1"' _ {} \;
            fi
          done

          # Clean Python Script to fix selinux_hide.c safely
          python3 - << 'EOF'
          import os, glob

          workspace = os.environ.get('GITHUB_WORKSPACE', '.')
          drivers_path = os.path.join(workspace, 'device_kernel/drivers')

          ksu_files = glob.glob(os.path.join(drivers_path, '**/ksu/**/*.c'), recursive=True) + \
                      glob.glob(os.path.join(drivers_path, '**/kernelsu/**/*.c'), recursive=True)

          for file_path in ksu_files:
              if os.path.exists(file_path):
                  with open(file_path, 'r') as f:
                      content = f.read()

                  updated = False

                  # Ensure security_context_to_sid always passes &selinux_state if legacy fallback lost it
                  if 'security_context_to_sid("u:r:ksu:s0"' in content:
                      content = content.replace(
                          'security_context_to_sid("u:r:ksu:s0"',
                          'security_context_to_sid(&selinux_state, "u:r:ksu:s0"'
                      )
                      updated = True

                  if 'security_context_to_sid("u:r:priv_app:s0:c512,c768"' in content:
                      content = content.replace(
                          'security_context_to_sid("u:r:priv_app:s0:c512,c768"',
                          'security_context_to_sid(&selinux_state, "u:r:priv_app:s0:c512,c768"'
                      )
                      updated = True

                  if updated:
                      with open(file_path, 'w') as f:
                          f.write(content)
                      print(f'[+] Injected &selinux_state in: {file_path}')
          EOF

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
