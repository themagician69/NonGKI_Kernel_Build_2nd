name: KSU old

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "poco f1"
  DEVICE_CODENAME : "beryllium"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  KERNEL_SOURCE : "https://github.com/JackA1ltman/kernel_xiaomi_sdm845_binder_cgroup_v2.git"
  KERNEL_BRANCH : "staging"

  CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH : "lineage-20.0"

  # Enable GNU GCC so the 32-bit and 64-bit cross compilers are properly set up by his script
  GCC_GNU : true
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/mi845_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # --- KERNELSU & SUSFS FULLY DISABLED ---
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "" 

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/Legendleo90/AnyKernel3.git"
  AK3_BRANCH : "electro"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "any rom"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: ""
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: ""

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/xiaomi/beryllium.config,vendor/debugfs.config"

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Xiaomi Mix2s (Evolution X 10 A15)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🧹 Clear Stale Ccache
        run: |
          ccache -C || true
          ccache -z || true

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel || true

      - name: 🧪 Apply Coccinelle Classic Hooks and KernelSU-Next v1.1.1
        run: |
          # 1. Install semantic patching tool (Coccinelle)
          sudo apt-get update
          sudo apt-get install -y coccinelle

          # 2. Clone the classic hooks repository
          git clone https://github.com/devnoname120/kernelsu-coccinelle.git /tmp/kernelsu-coccinelle

          # 3. Apply the manual hooks to your kernel source first
          cd /tmp/kernelsu-coccinelle/classic-hooks
          ./apply.sh $GITHUB_WORKSPACE/device_kernel

          # 4. Safely inject forward declarations into fs/namespace.c using Python
          python3 - << 'EOF'
          import re

          path = "$GITHUB_WORKSPACE/device_kernel/fs/namespace.c"
          with open(path, "r") as f:
              content = f.read()

          declarations = """
          struct mount;
          static inline bool may_mount(void);
          static inline int check_mnt(struct mount *mnt);
          static int do_umount(struct mount *mnt, int flags);
          static void mntput_no_expire(struct mount *mnt);
          """

          matches = list(re.finditer(r'^#include\s+["<].*?[">]', content, re.MULTILINE))
          if matches:
              pos = matches[-1].end()
              content = content[:pos] + "\n" + declarations + content[pos:]
              with open(path, "w") as f:
                  f.write(content)
              print("[+] Successfully added namespace forward declarations.")
          else:
              print("[-] Warning: Could not find #include headers in fs/namespace.c")
          EOF

          # 5. Run the KernelSU-Next v1.1.1 setup script on the newly hooked source
          cd $GITHUB_WORKSPACE/device_kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.1.1

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
  MERGE_CONFIG_FILES: "vendor/xiaomi/beryllium.config,vendor/debugfs.config"

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Xiaomi Mix2s (Evolution X 10 A15)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🧹 Clear Stale Ccache
        run: |
          ccache -C || true
          ccache -z || true

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel || true

      - name: 🧪 Apply Coccinelle Classic Hooks and KernelSU-Next v1.1.1
        run: |
          # 1. Install semantic patching tool (Coccinelle)
          sudo apt-get update
          sudo apt-get install -y coccinelle

          # 2. Clone the classic hooks repository
          git clone https://github.com/devnoname120/kernelsu-coccinelle.git /tmp/kernelsu-coccinelle

          # 3. Apply the manual hooks to your kernel source first
          cd /tmp/kernelsu-coccinelle/classic-hooks
          ./apply.sh $GITHUB_WORKSPACE/device_kernel

          # 4. Fix implicit declaration errors in fs/namespace.c for Linux 4.9 using single-line sed
          sed -i '/#include "mount.h"/a struct mount; static inline bool may_mount(void); static inline int check_mnt(struct mount *mnt); static int do_umount(struct mount *mnt, int flags); static void mntput_no_expire(struct mount *mnt);' $GITHUB_WORKSPACE/device_kernel/fs/namespace.c

          # 5. Run the KernelSU-Next v1.1.1 setup script on the newly hooked source
          cd $GITHUB_WORKSPACE/device_kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.1.1

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
