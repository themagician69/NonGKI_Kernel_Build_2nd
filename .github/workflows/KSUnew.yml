name: KSU v3

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "poco f1"
  DEVICE_CODENAME : "beryllium"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  KERNEL_SOURCE : "https://github.com/JackA1ltman/kernel_xiaomi_sdm845_binder_cgroup_v2.git"
  KERNEL_BRANCH : "staging"

  CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH : "lineage-20.0"

  # Enable GNU GCC so the 32-bit and 64-bit cross compilers are properly set up by his script
  GCC_GNU : true
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/mi845_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # --- KERNELSU & SUSFS FULLY DISABLED ---
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "" 

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/Legendleo90/AnyKernel3.git"
  AK3_BRANCH : "electro"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "any rom"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: ""
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: "" 

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: ""

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/xiaomi/beryllium.config,vendor/debugfs.config"

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Xiaomi Mix2s (Evolution X 10 A15)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🧹 Clear Stale Ccache
        run: |
          ccache -C || true
          ccache -z || true

      - name: 🪛 Extra Kernel Options & Enable CONFIG_KSU
        run: |
          cd $GITHUB_WORKSPACE/device_kernel || true
          CONFIG_FILE="arch/arm64/configs/vendor/xiaomi/beryllium.config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
            echo "[+] Successfully appended CONFIG_KSU=y to $CONFIG_FILE"
          else
            echo "[-] Warning: beryllium.config not found at $CONFIG_FILE"
          fi

      - name: 🧪 Apply SM6250 Manual Drivers & KernelSU-Next v3+
        run: |
          sudo apt-get update
          sudo apt-get install -y patchutils python3

          cd $GITHUB_WORKSPACE/device_kernel

          # 1. Download commit 7f5f639 from rifsxd/android_kernel_xiaomi_sm6250
          echo "[+] Downloading manual hook patch..."
          curl -sSL https://github.com/rifsxd/android_kernel_xiaomi_sm6250/commit/7f5f639fb8d98e893e9bfc14d922e865b42c1806.patch -o raw_commit.patch

          # 2. Filter out drivers/ksu from patch to avoid conflicts with KernelSU-Next source
          echo "[+] Filtering out duplicate driver files..."
          filterdiff -x 'a/drivers/ksu/*' -x 'b/drivers/ksu/*' \
                     -x 'a/drivers/kernelsu/*' -x 'b/drivers/kernelsu/*' \
                     raw_commit.patch > core_hooks.patch || cp raw_commit.patch core_hooks.patch

          # 3. Apply core VFS/drivers hooks
          echo "[+] Applying core kernel hooks..."
          git apply --3way --ignore-whitespace core_hooks.patch || {
            echo "[!] Standard 3-way patch failed. Attempting fuzzy apply..."
            git apply --reject --whitespace=fix core_hooks.patch || true
          }
          rm -f raw_commit.patch core_hooks.patch

          # 4. Inject ksu_handle_execveat forward declaration into fs/exec.c
          python3 - << 'EOF'
          import os
          import re

          workspace = os.environ.get("GITHUB_WORKSPACE", ".")
          path = os.path.join(workspace, "device_kernel/fs/exec.c")

          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()

              if "ksu_handle_execveat" not in content[:content.find("ksu_handle_execveat") if "ksu_handle_execveat" in content else len(content)]:
                  header = """
          #ifdef CONFIG_KSU
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          #else
          static inline int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }
          #endif
          """
                  matches = list(re.finditer(r'^#include\s+["<].*?[">]', content, re.MULTILINE))
                  if matches:
                      pos = matches[-1].end()
                      content = content[:pos] + "\n" + header + content[pos:]
                      with open(path, "w") as f:
                          f.write(content)
                      print("[+] Successfully added ksu_handle_execveat forward declaration to fs/exec.c")
          EOF

          # 5. Safely inject forward declarations into fs/namespace.c
          python3 - << 'EOF'
          import os
          import re

          workspace = os.environ.get("GITHUB_WORKSPACE", ".")
          path = os.path.join(workspace, "device_kernel/fs/namespace.c")

          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()

              if "struct mount;" not in content:
                  declarations = """
          struct mount;
          static inline bool may_mount(void);
          static inline int check_mnt(struct mount *mnt);
          static int do_umount(struct mount *mnt, int flags);
          static void mntput_no_expire(struct mount *mnt);
          """
                  matches = list(re.finditer(r'^#include\s+["<].*?[">]', content, re.MULTILINE))
                  if matches:
                      pos = matches[-1].end()
                      content = content[:pos] + "\n" + declarations + content[pos:]
                      with open(path, "w") as f:
                          f.write(content)
                      print("[+] Successfully added namespace forward declarations.")
          EOF

          # 6. Fetch KernelSU-Next v3+ driver tree into drivers/ksu
          echo "[+] Fetching KernelSU-Next v3+ source..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy


      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
